services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:main

    restart: unless-stopped

    volumes:
      - ./unbound:/etc/unbound/custom.conf.d:ro

    networks:
      openwrt_openvpn:
        ipv4_address: 172.31.255.254
        ipv6_address: fdff:ffff:dc59:1312:ffff:ffff:ffff:ffff


networks:
  openwrt_openvpn:
    name: openwrt_openvpn
    driver: bridge

    driver_opts:
      com.docker.network.bridge.name: br-openvpn

    enable_ipv6: true

    ipam:
      driver: default
      config:
        - subnet: 172.31.255.0/24
          gateway: 172.31.255.1

        - subnet: fdff:ffff:dc59:1312::/64
          gateway: fdff:ffff:dc59:1312::1
