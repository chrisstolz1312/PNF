services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:main
    restart: unless-stopped

    volumes:
      - ./unbound:/etc/unbound/custom.conf.d:ro

    networks:
      openwrt_openvpn:
        ipv4_address: 172.31.255.253
        ipv6_address: fdff:ffff:dc59:1312::253

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD muss gesetzt sein}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: "172.31.255.253;fdff:ffff:dc59:1312::253"

    volumes:
      - ./pihole:/etc/pihole

    networks:
      openwrt_openvpn:
        ipv4_address: 172.31.255.254
        ipv6_address: fdff:ffff:dc59:1312::254

    depends_on:
      - unbound

networks:
  openwrt_openvpn:
    external: true
    name: openwrt_openvpn
