services:
  ca-web:
    build:
      context: .
      dockerfile: Dockerfile

    image: web_ca_openvpn
    container_name: ca-web

    restart: unless-stopped

    # systemd als PID 1
    init: false
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s

    # Testkonfiguration für systemd und cgroup v2
    privileged: true
    cgroup: private

    tmpfs:
      - /run
      - /run/lock

    volumes:
      - ./ca:/ca
      - ./server_export:/server_export
      - ./crl:/crl

    ports:
      - "8080:80"

    networks:
      admin_bridge:
        ipv4_address: 192.168.255.2

networks:
  admin_bridge:
    external: true
